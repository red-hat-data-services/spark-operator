name: ScheduledSpark Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'test/e2e/rhoai/**'
      - 'config/**'
      - '.github/workflows/scheduledspark-smoke.yaml'
  pull_request:
    paths:
      - 'test/e2e/rhoai/**'
      - 'config/**'
      - '.github/workflows/scheduledspark-smoke.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Create a Kind cluster
        run: make kind-create-cluster

      - name: Build and load image to Kind cluster
        run: make kind-load-image IMAGE_TAG=local

      - name: Run OpenShift e2e tests (operator install + scheduled spark + RBAC)
        run: make e2e-rhoai-test
        env:
          INSTALL_METHOD: kustomize
          SPARK_OPERATOR_IMAGE: ghcr.io/kubeflow/spark-operator/controller:local
          SKIP_SPARK_JOB_TESTS: "true"
