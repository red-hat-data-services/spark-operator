# Draft ci-operator config for red-hat-data-services/spark-operator
#
# Target path in openshift/release:
#   ci-operator/config/red-hat-data-services/spark-operator/red-hat-data-services-spark-operator-main.yaml
#
# This config:
#   1. Builds the Spark Operator image from source
#   2. Runs the RHOAI e2e tests on an OpenShift cluster
#   3. Runs the TLS-Scanner as a best-effort post step
#
# References:
#   - RHOAIENG-95821 / RHOAIENG-95815
#   - openshift/release#82555 (opendatahub-operator reference implementation)
#   - https://steps.ci.openshift.org/reference/tls-scanner-run
base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
  ubi:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    from: ubi
    optional: true
    to: spark-operator
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.20"
resources:
  '*':
    requests:
      cpu: 400m
      memory: 200Mi
tests:
- as: spark-operator-rhoai-e2e
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  steps:
    allow_best_effort_post_steps: true
    dependencies:
      SOURCE_IMAGE_REF: spark-operator
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: redhat-ods-applications
    test:
    - as: e2e
      cli: latest
      commands: |
        unset GOFLAGS
        make -C test/e2e/rhoai e2e-rhoai-test \
          INSTALL_METHOD=kustomize \
          SPARK_OPERATOR_IMAGE=${SOURCE_IMAGE_REF}
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 3Gi
      timeout: 1h0m0s
    - ref: tls-scanner-run
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: red-hat-data-services
  repo: spark-operator
