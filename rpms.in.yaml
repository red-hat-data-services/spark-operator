arches:
  - x86_64
  - aarch64
  - ppc64le
  - s390x

contentOrigin:
  repofiles:
    - ./ubi.repo

packages:
  # groupadd/useradd (missing on python-*-minimal)
  - shadow-utils
  # spark user shell
  - bash
  # Java 21 OpenJDK for Spark operator (UBI 10 has no Java 17)
  - java-21-openjdk-devel
  # Podman - provides catatonit as the init system for containers
  - podman

context:
  containerfile:
    file: "./Dockerfile.konflux"
    stageName: runtime
